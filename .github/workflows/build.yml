name: Build and compatibility
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-latest
            rid: win-arm64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
      - name: Build unchanged .NET 8 sample
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: c12075eb5ed5f2e6a86872657a73ebfcfcfd5fa5
          path: baseline
      - shell: pwsh
        run: |
          dotnet build baseline/SampleHealerPlugin/SampleHealerPlugin.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "Baseline plugin build failed." }
          dotnet build FabricHealer.Managed.slnf -c Release
          if ($LASTEXITCODE -ne 0) { throw "Managed build failed." }
      - name: Execute old and new plugin compatibility cases
        shell: pwsh
        run: |
          $env:FH_LEGACY_PLUGIN_PATH = Join-Path $PWD 'baseline/SampleHealerPlugin/bin/Release/net8.0/SampleHealerPlugin.dll'
          $env:FH_CURRENT_PLUGIN_PATH = Join-Path $PWD 'SampleHealerPlugin/bin/Release/net10.0/SampleHealerPlugin.dll'
          dotnet test FHTest/FHTest.csproj -c Release --no-build --filter FullyQualifiedName~PluginCompatibilityTests --logger trx --results-directory TestResults
          if ($LASTEXITCODE -ne 0) { throw "Plugin compatibility tests failed." }
      - name: Verify design-time builds do not publish fixtures
        shell: pwsh
        run: |
          $fixture = Join-Path $PWD 'FHTest/obj/TestApp42.zip'
          $before = (Get-Item -LiteralPath $fixture).LastWriteTimeUtc
          dotnet msbuild FHTest/FHTest.csproj -target:PrepareForBuild -property:DesignTimeBuild=true -property:Configuration=Release
          if ($LASTEXITCODE -ne 0) { throw "Design-time build failed." }
          if ((Get-Item -LiteralPath $fixture).LastWriteTimeUtc -ne $before) { throw "Design-time build recreated the fixture." }
          $backup = "$fixture.design-time-backup"
          Move-Item -LiteralPath $fixture -Destination $backup
          try {
            dotnet msbuild FHTest/FHTest.csproj -target:PrepareForBuild -property:DesignTimeBuild=true -property:Configuration=Release
            if ($LASTEXITCODE -ne 0) { throw "Design-time build without a fixture failed." }
            if (Test-Path -LiteralPath $fixture) { throw "Design-time build generated a missing fixture." }
          } finally {
            Move-Item -LiteralPath $backup -Destination $fixture -Force
          }
      - name: Publish both deployment modes and build packages
        shell: pwsh
        run: |
          ./Build-FabricHealer.ps1 -RuntimeId '${{ matrix.rid }}'
          ./Build-SFPKGs.ps1 -RuntimeIds '${{ matrix.rid }}'
          ./Build-NugetPackages.ps1 -RuntimeIds '${{ matrix.rid }}'
          ./Build-FHProxyNupkg.ps1
      - name: Validate restored NuGet deployment trees
        shell: pwsh
        run: ./Test-DeploymentNuget.ps1 -RuntimeIds '${{ matrix.rid }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fabrichealer-${{ matrix.rid }}
          path: |
            TestResults/**
            bin/release/FabricHealer/SFPkgs/*.sfpkg
            bin/release/FabricHealer/Nugets/*.nupkg
            bin/release/FabricHealerProxy/Nugets/*.nupkg
